name: Personal site CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"
      - "feature/**"
      - "fix/**"
      - "chore/**"
      - "docs/**"
      - "site/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-site-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the site
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Garden Studio dependencies
        run: npm ci --prefix garden-studio

      - name: Install Quartz plugins
        run: npm run install-plugins

      - name: Check types and formatting
        run: npm run check

      - name: Check Garden Studio
        run: npm run studio:check

      - name: Test Garden Studio
        run: npm run studio:test

      - name: Run tests
        run: npm test

      - name: Build the site from content
        run: npx quartz build -d content

      - name: Build Garden Studio
        run: npm run studio:build
